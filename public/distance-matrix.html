<html>
  <head>
    <title>Distance Matrix Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      function initMap() {
        const bounds = new google.maps.LatLngBounds();
        const markersArray = [];
        const map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 55.53, lng: 9.4 },
          zoom: 10,
        });

        const geocoder = new google.maps.Geocoder();
        const service = new google.maps.DistanceMatrixService();

        const origin1 = { lat: 55.93, lng: -3.118 };
        const origin2 = "Greenwich, England";
        const destinationA = "Stockholm, Sweden";
        const destinationB = { lat: 50.087, lng: 14.421 };

        const request = {
          origins: [origin1, origin2],
          destinations: [destinationA, destinationB],
          travelMode: google.maps.TravelMode.DRIVING,
          unitSystem: google.maps.UnitSystem.METRIC,
          avoidHighways: false,
          avoidTolls: false,
        };

        document.getElementById("request").textContent = JSON.stringify(request, null, 2);

        service.getDistanceMatrix(request).then((response) => {
          document.getElementById("response").textContent = JSON.stringify(response, null, 2);

          const originList = response.originAddresses;
          const destinationList = response.destinationAddresses;

          markersArray.forEach((m) => m.setMap(null));
          markersArray.length = 0;

          const showGeocodedAddressOnMap = (asDestination) => ({ results }) => {
            map.fitBounds(bounds.extend(results[0].geometry.location));
            markersArray.push(
              new google.maps.Marker({
                map,
                position: results[0].geometry.location,
                label: asDestination ? "D" : "O",
              })
            );
          };

          for (let i = 0; i < originList.length; i++) {
            geocoder
              .geocode({ address: originList[i] })
              .then(showGeocodedAddressOnMap(false));
          }

          for (let j = 0; j < destinationList.length; j++) {
            geocoder
              .geocode({ address: destinationList[j] })
              .then(showGeocodedAddressOnMap(true));
          }
        });
      }

      window.initMap = initMap;
    </script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        font-family: "Inter", sans-serif;
        background: #ffffff;
        color: #111827;
      }

      #container {
        display: flex;
        height: 100%;
      }

      #map {
        flex: 1;
        height: 100%;
      }

      #sidebar {
        width: 23rem;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-left: 2px solid #ec4899;
        overflow: hidden;
        box-shadow: -4px 0 20px rgba(236, 72, 153, 0.15);
      }

      .sidebar-header {
        padding: 1.25rem 1.5rem;
        background: #ec4899;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .sidebar-header::before {
        content: "";
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #db2777;
        flex-shrink: 0;
      }

      .sidebar-header h1 {
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffffff;
      }

      .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-bottom: 1px solid #fce7f3;
      }

      .panel:last-child {
        border-bottom: none;
      }

      .panel-label {
        padding: 0.6rem 1.5rem;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffffff;
        background: #db2777;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .panel-label::before {
        content: "";
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
      }

      pre {
        flex: 1;
        overflow: auto;
        padding: 1rem 1.25rem;
        font-family: "Inter", monospace;
        font-size: 0.72rem;
        line-height: 1.8;
        color: #374151;
        background: #fdf2f8;
        white-space: pre-wrap;
        word-break: break-word;
        border-top: 1px solid #fbcfe8;
      }

      pre::-webkit-scrollbar {
        width: 4px;
      }

      pre::-webkit-scrollbar-track {
        background: #fdf2f8;
      }

      pre::-webkit-scrollbar-thumb {
        background: #ec4899;
        border-radius: 4px;
      }

      pre::-webkit-scrollbar-thumb:hover {
        background: #db2777;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="map"></div>
      <div id="sidebar">
        <div class="sidebar-header">
          <h1>Distance Matrix</h1>
        </div>
        <div class="panel">
          <div class="panel-label">Request</div>
          <pre id="request"></pre>
        </div>
        <div class="panel">
          <div class="panel-label">Response</div>
          <pre id="response"></pre>
        </div>
      </div>
    </div>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=INSERT_YOUR_API_KEY&callback=initMap&v=weekly&solution_channel=GMP_CCS_distancematrix_v2"
      defer
    ></script>
  </body>
</html>
